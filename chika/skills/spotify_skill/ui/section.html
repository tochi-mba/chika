  <div class="integration-head">
    <svg viewBox="0 0 32 32" width="22" height="22" aria-hidden="true">
      <circle cx="16" cy="16" r="16" fill="#1DB954"/>
      <path d="M22.7 22.4c-.3.5-.9.7-1.4.4-3.8-2.3-8.6-2.8-14.2-1.5-.5.1-1-.2-1.2-.7-.1-.5.2-1 .7-1.2 6.1-1.4 11.4-.8 15.7 1.7.5.3.7.9.4 1.3zm1.8-3.6c-.4.6-1.1.8-1.7.4-4.4-2.7-11-3.5-16.2-1.9-.7.2-1.4-.2-1.6-.8-.2-.7.2-1.4.8-1.6 5.9-1.8 13.2-.9 18.2 2.2.6.4.8 1.1.5 1.7zm.1-3.7C19 12.1 10.6 11.7 5.6 13.2c-.8.2-1.6-.2-1.9-1-.2-.8.2-1.6 1-1.9 5.7-1.7 15-1.3 21 2.3.7.4.9 1.3.5 2-.4.7-1.3.9-2 .5z" fill="#000"/>

    <div class="integration-meta">
      <strong>Spotify</strong>
      <span data-role="status-label" class="hint">Checking&hellip;</span>
    </div>
    <span data-role="dot" class="dot off"></span>
  </div>
  <p data-role="scope" class="hint" hidden></p>
  <div class="integration-actions">
    <button type="button" data-role="connect"    class="btn-primary spotify-primary">Connect Spotify</button>
    <button type="button" data-role="disconnect" class="btn-secondary" hidden>Disconnect</button>
    <button type="button" data-role="reconnect"  class="btn-secondary" hidden>Reconnect</button>
  </div>
  <div data-role="fallback" class="integration-fallback" hidden>
    <p class="hint">Browser didn't open. Paste this URL:</p>
    <div class="input-row">
      <input type="text" data-role="auth-url" readonly />
      <button type="button" data-role="copy-url" class="btn-secondary">Copy</button>
    </div>
  </div>
  <p data-role="error" class="hint error" hidden></p>

  <div class="share-row">
    <div class="share-text">
      <strong>Share across all profiles</strong>
      <p class="hint">When on, every profile uses one connection. When off, each profile connects independently.</p>
    </div>
    <label class="switch">
      <input type="checkbox" data-role="share" />
      <span class="track"><span class="thumb"></span></span>
    </label>
  </div>
</div>
