version: "3.9"

services:
  chika:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHIKA_PROVIDER=${CHIKA_PROVIDER:-anthropic}
    volumes:
      # Persist user data across container restarts
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
