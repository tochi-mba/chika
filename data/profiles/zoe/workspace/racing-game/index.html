<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Kart GP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="minimap" width="180" height="180"></canvas>
  <div id="hud">
    <div id="position">1st</div>
    <div id="lap">Lap 1 / 3</div>
    <div id="speed">0 km/h</div>
  </div>
  <div id="item-box"></div>
  <div id="overlay">
    <h1>🏁 NEON KART GP</h1>
    <p>Arrow keys / WASD to steer &amp; accelerate<br>SPACE to use item &bull; Race 3 laps against 5 rivals!</p>
    <button id="startBtn">RACE!</button>
  </div>
  <div id="countdown" style="display:none">3</div>
  <div id="results" style="display:none">
    <h1 id="resultsTitle">FINISH!</h1>
    <div id="resultsTable"></div>
    <button id="restartBtn">RACE AGAIN</button>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
