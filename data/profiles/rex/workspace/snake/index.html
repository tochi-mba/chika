<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game - Tochi Mba</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="overlay">
    <div id="overlay-content">
      <h1>Tochi Mba Snake Game</h1>
      <p>Customize particle physics and start when ready.</p>
      <button id="startBtn">Start Game</button>
      <div id="settings">
        <h2>Particle Settings</h2>
        <label>Color: <input type="color" id="particleColor" value="#00FF00"></label>
        <label>Shape:
          <select id="particleShape">
            <option value="square">Square</option>
            <option value="circle">Circle</option>
          </select>
        </label>
        <label>Style:
          <select id="particleStyle">
            <option value="glow">Glow</option>
            <option value="spark">Spark</option>
            <option value="trail">Trail</option>
          </select>
        </label>
      </div>
    </div>
  </div>

  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <script src="game.js"></script>
</body>
</html>
