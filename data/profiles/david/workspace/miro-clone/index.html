<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram Viewer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Toolbar -->
  <div id="toolbar">
    <div class="toolbar-group">
      <button id="btn-select" class="tool-btn active" title="Select (V)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
      </button>
      <button id="btn-rect" class="tool-btn" title="Rectangle (R)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
      </button>
      <button id="btn-ellipse" class="tool-btn" title="Ellipse (E)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="10" ry="8"/></svg>
      </button>
      <button id="btn-diamond" class="tool-btn" title="Diamond (D)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l10 10-10 10L2 12z"/></svg>
      </button>
      <button id="btn-text" class="tool-btn" title="Text (T)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3"/><path d="M12 4v16"/><path d="M8 20h8"/></svg>
      </button>
      <button id="btn-line" class="tool-btn" title="Connection (L)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 19L19 5"/><path d="M15 5h4v4"/></svg>
      </button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-group">
      <input type="color" id="fill-color" value="#4A90D9" title="Fill Color">
      <input type="color" id="stroke-color" value="#2C3E50" title="Stroke Color">
      <select id="stroke-width" title="Stroke Width">
        <option value="1">1px</option>
        <option value="2" selected>2px</option>
        <option value="3">3px</option>
        <option value="4">4px</option>
      </select>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-group">
      <button id="btn-duplicate" class="tool-btn" title="Duplicate (Ctrl+D)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="1"/><path d="M4 16V4h12"/></svg>
      </button>
      <button id="btn-delete" class="tool-btn" title="Delete (Del)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M5 6l1 14h12l1-14"/></svg>
      </button>
      <button id="btn-clear" class="tool-btn" title="Clear All">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 8l8 8"/><path d="M16 8l-8 8"/></svg>
      </button>
    </div>
    <div class="toolbar-divider"></div>
    <div class="toolbar-group">
      <button id="btn-undo" class="tool-btn" title="Undo (Ctrl+Z)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10h10a5 5 0 015 5v0a5 5 0 01-5 5H8"/><path d="M7 14l-4-4 4-4"/></svg>
      </button>
      <button id="btn-redo" class="tool-btn" title="Redo (Ctrl+Y)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10H11a5 5 0 00-5 5v0a5 5 0 005 5h5"/><path d="M17 14l4-4-4-4"/></svg>
      </button>
    </div>
    <div class="toolbar-spacer"></div>
    <div class="toolbar-group">
      <span id="zoom-level">100%</span>
      <button id="btn-zoom-in" class="tool-btn" title="Zoom In">+</button>
      <button id="btn-zoom-out" class="tool-btn" title="Zoom Out">−</button>
      <button id="btn-zoom-fit" class="tool-btn" title="Fit to Screen">⊡</button>
    </div>
  </div>

  <!-- Canvas -->
  <canvas id="canvas"></canvas>

  <!-- Text Edit Overlay -->
  <textarea id="text-editor" style="display:none;"></textarea>

  <!-- Properties Panel -->
  <div id="properties-panel" style="display:none;">
    <h3>Properties</h3>
    <label>Text: <input type="text" id="prop-text"></label>
    <label>Font Size: <input type="number" id="prop-font-size" min="8" max="120" value="16"></label>
    <label>Opacity: <input type="range" id="prop-opacity" min="0" max="1" step="0.05" value="1"></label>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
