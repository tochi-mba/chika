<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
  table { margin: 0 auto; border-collapse: collapse; }
  td { width: 100px; height: 100px; border: 2px solid #333; font-size: 48px; text-align: center; vertical-align: middle; cursor: pointer; }
  #status { margin-top: 20px; font-size: 24px; }
  button { margin-top: 10px; padding: 10px 20px; font-size: 18px; }
</style>
</head>
<body>
<h1>Tic Tac Toe</h1>
<table id="board"></table>
<div id="status"></div>
<button onclick="resetGame()">Reset</button>
<script>
const boardElement = document.getElementById('board');
const statusElement = document.getElementById('status');
let board = ['', '', '', '', '', '', '', '', ''];
let currentPlayer = 'X';
let gameOver = false;

function renderBoard() {
  boardElement.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const row = document.createElement('tr');
    for (let j = 0; j < 3; j++) {
      const cell = document.createElement('td');
      const index = i * 3 + j;
      cell.textContent = board[index];
      cell.onclick = () => makeMove(index);
      row.appendChild(cell);
    }
    boardElement.appendChild(row);
  }
}

function makeMove(index) {
  if (board[index] || gameOver) return;
  board[index] = currentPlayer;
  if (checkWinner()) {
    statusElement.textContent = `${currentPlayer} wins!`;
    gameOver = true;
  } else if (board.every(cell => cell)) {
    statusElement.textContent = 'Draw!';
    gameOver = true;
  } else {
    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    statusElement.textContent = `${currentPlayer}'s turn`;
  }
  renderBoard();
}

function checkWinner() {
  const combos = [
    [0,1,2], [3,4,5], [6,7,8],
    [0,3,6], [1,4,7], [2,5,8],
    [0,4,8], [2,4,6]
  ];
  return combos.some(combo => combo.every(i => board[i] === currentPlayer));
}

function resetGame() {
  board = ['', '', '', '', '', '', '', '', ''];
  currentPlayer = 'X';
  gameOver = false;
  statusElement.textContent = `${currentPlayer}'s turn`;
  renderBoard();
}

resetGame();
</script>
</body>
</html>
