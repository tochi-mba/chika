<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chika</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup" id="app">

    <!-- Header -->
    <div class="header">
      <div class="brand">
        <!-- chika trefoil mark.  See frontend/src/components/ChikaMark.vue
             for the canonical version + design rationale.  This inline
             copy stays in parity by hand because the popup can't
             import the Vue component. -->
        <svg id="chikaMark" class="chika-mark s-idle"
             width="20" height="20"
             viewBox="-60 -60 120 120" aria-hidden="true">
          <g class="petals">
            <g class="petal-wrap petal-wrap-0" transform="rotate(0)">
              <path class="petal" d="M 0,-58 C 13,-44 19,-22 0,-6 C -19,-22 -13,-44 0,-58 Z"/>
            </g>
            <g class="petal-wrap petal-wrap-1" transform="rotate(120)">
              <path class="petal" d="M 0,-58 C 13,-44 19,-22 0,-6 C -19,-22 -13,-44 0,-58 Z"/>
            </g>
            <g class="petal-wrap petal-wrap-2" transform="rotate(240)">
              <path class="petal" d="M 0,-58 C 13,-44 19,-22 0,-6 C -19,-22 -13,-44 0,-58 Z"/>
            </g>
            <circle class="hub-dot" cx="0" cy="0" r="3.2"/>
          </g>
        </svg>
        <span class="brand-name">Chika</span>
      </div>
      <div class="header-right">
        <span class="session-title" id="sessionTitle"></span>
        <span class="status-dot" id="statusDot" title=""></span>
        <a href="../options/options.html" target="_blank" class="icon-btn" title="Settings">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </a>
      </div>
    </div>

    <!-- Auth error -->
    <div class="error-banner" id="authError" style="display:none">
      Invalid API key.
      <a href="../options/options.html" target="_blank">Fix in Settings</a>
    </div>

    <!-- Not configured -->
    <div class="setup-view" id="notConfigured" style="display:none">
      <div class="setup-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"
            fill="#6c63ff" stroke="#6c63ff" stroke-width="1" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="setup-text">Connect Chika to your browser</p>
      <p class="setup-sub">Enter your server URL in Settings to get started.</p>
      <a href="../options/options.html" target="_blank" class="btn-primary">Open Settings</a>
    </div>

    <!-- Disconnected -->
    <div class="setup-view" id="disconnectedView" style="display:none">
      <div class="disconnected-orb"></div>
      <p class="setup-text">Not connected</p>
      <p class="setup-sub" id="disconnectedSub">Make sure the Chika server is running.</p>
      <button class="btn-retry" id="retryBtn">Retry</button>
    </div>

    <!-- Profile gate — every popup boot picks a profile before chatting. -->
    <div class="profile-gate" id="profileGate" style="display:none">
      <div class="profile-gate-head">
        <p class="setup-text">Who's working today?</p>
        <p class="setup-sub" id="profileGateSub">Pick a profile to load its memory + workspace.</p>
      </div>
      <ul class="profile-list" id="profileList"></ul>
      <button class="profile-create-toggle" id="profileCreateToggle">+ New profile</button>

      <!-- Password sub-view (shown when the picked profile is locked) -->
      <div class="profile-pwd" id="profilePwd" style="display:none">
        <button class="profile-back" id="profilePwdBack">← Back</button>
        <label class="profile-label">
          <span id="profilePwdName">Password</span>
          <input type="password" id="profilePwdInput" autocomplete="current-password" placeholder="••••••" />
        </label>
        <div class="profile-error" id="profilePwdError" style="display:none"></div>
        <button class="btn-primary" id="profilePwdSubmit">Continue</button>
        <button class="profile-back profile-fallback" id="profilePwdFallback" style="display:none">
          Locked out? Create a new profile instead →
        </button>
      </div>

      <!-- Create sub-view -->
      <div class="profile-create" id="profileCreate" style="display:none">
        <button class="profile-back" id="profileCreateBack">← Back</button>
        <label class="profile-label">
          <span>Profile name</span>
          <input type="text" id="profileNewName" placeholder="e.g. tochi" />
        </label>
        <label class="profile-label">
          <span>Password (optional)</span>
          <input type="password" id="profileNewPwd" autocomplete="new-password"
                 placeholder="leave empty for no password" />
        </label>
        <div class="profile-error" id="profileCreateError" style="display:none"></div>
        <button class="btn-primary" id="profileCreateSubmit">Create + use</button>
      </div>
    </div>

    <!-- Chat view -->
    <div class="chat-view" id="chatView" style="display:none">

      <!-- Active shells strip — every running shell is visible with a kill button. -->
      <div class="ext-shells" id="extShells" style="display:none">
        <div class="ext-shells-head">
          <span class="ext-shells-label">Active shells</span>
          <span class="ext-shells-count" id="extShellsCount"></span>
          <button class="ext-shells-killall" id="extShellsKillAll" title="Kill every running shell">Kill all</button>
        </div>
        <ul class="ext-shells-list" id="extShellsList"></ul>
      </div>

      <!-- Plan strip — visible when an active plan exists. -->
      <div class="ext-plan" id="extPlan" style="display:none">
        <div class="ext-plan-row">
          <span class="ext-plan-glyph">⏷</span>
          <span class="ext-plan-goal" id="extPlanGoal"></span>
          <span class="ext-plan-progress" id="extPlanProgress"></span>
        </div>
        <div class="ext-plan-actions">
          <button class="ext-plan-btn accept" id="extPlanAccept" title="Tell agent the plan is good">✓ accept</button>
          <button class="ext-plan-btn edit"   id="extPlanEdit"   title="Send feedback to tweak the plan">✎ edit</button>
          <button class="ext-plan-btn reject" id="extPlanReject" title="Reject and ask for a new plan">✕ reject</button>
        </div>
      </div>

      <div class="msg-list" id="msgList">
        <!-- Populated by popup.js -->
      </div>

      <!-- Pet companion (mirrors profile pet from server) -->
      <div class="ext-pet" id="extPet" style="display:none" title="Your pet">
        <span class="ext-pet-bubble" id="extPetBubble"></span>
        <span class="ext-pet-emoji" id="extPetEmoji">🐾</span>
      </div>

      <div class="input-area">
        <div class="input-row" id="inputRow">
          <button class="tab-ctx-btn" id="tabCtxBtn"
                  title="Include current page content as context"
                  aria-pressed="false">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <path d="M3 9h18"/>
              <path d="M9 21V9"/>
            </svg>
          </button>
          <textarea
            id="chatInput"
            class="chat-input"
            placeholder="Message Chika…"
            rows="1"
            autocomplete="off"
            spellcheck="true"
          ></textarea>
          <button class="stop-btn" id="stopBtn" style="display:none" title="Stop (Esc)">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="currentColor">
              <rect x="1" y="1" width="9" height="9" rx="1.5"/>
            </svg>
          </button>
          <button class="send-btn" id="sendBtn" disabled title="Send (Enter)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2L11 13"/>
              <path d="M22 2L15 22 11 13 2 9l20-7z"/>
            </svg>
          </button>
        </div>
      </div>

    </div>

  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
