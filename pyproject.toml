[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chika"
version = "2.0.0"
description = "Agentic AI assistant with workflow orchestration and multi-provider LLM support"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "httpx>=0.27.0",
    "ddgs>=9.0.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "bandit>=1.7",
]

[project.scripts]
chika = "chika:cli"

[tool.setuptools]
py-modules = ["chika", "config"]

[tool.setuptools.packages.find]
include = ["chika*", "api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "chika/skills"]
python_files = ["test_*.py"]

[tool.coverage.run]
omit = [
    "*/tests/*",
    "tests/*",
    "*/conftest.py",
    "*/_test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".workspace",
    "data",
    "*.log",
    "*.log.*",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "E501",   # line too long (handled by line-length)
    "E402",   # module-level import not at top — intentional lazy imports
    "E701",   # multiple statements on one line (colon) — guard-clause style used throughout
    "E702",   # multiple statements on one line (semicolon) — same
    "E741",   # ambiguous variable name — l, O, etc. acceptable in short scopes
    "F821",   # undefined name — forward refs in TYPE_CHECKING blocks
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "I001"]         # test helpers may import for side effects; sort not enforced
"_test_*.py" = ["E401", "I001", "F401"]  # test harness files use multi-imports
"api/server.py" = ["I001"]           # inline 'import traceback' inside except blocks
"api/session_manager.py" = ["I001"]
"chika/skills/*/  __init__.py" = ["I001"]  # skill files loaded at runtime

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
