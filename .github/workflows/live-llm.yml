name: Live LLM Smoke

# Manually triggered ONLY — calls a real upstream LLM and burns tokens.
# Use this before a release to confirm the prompt + tool wiring still
# works end-to-end against the real model.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "LLM provider"
        required: true
        default: "anthropic"
        type: choice
        options:
          - anthropic
          - openai
          - azure

jobs:
  live-llm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run live-LLM smoke pack
        env:
          CHIKA_PROVIDER: ${{ inputs.provider }}
          # Pulled from repository secrets — set these once in your repo's
          # Settings → Secrets and variables → Actions:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          AZURE_OPENAI_KEY:     ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          # Belt-and-braces — the conftest also reads --live-llm from the CLI.
          CHIKA_RUN_LIVE_LLM: "1"
        run: |
          pytest tests/test_live_llm_smoke.py -v --tb=short --live-llm
