name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        env:
          CHIKA_PROVIDER: anthropic
          ANTHROPIC_API_KEY: test-key
        run: pytest tests/ -v --tb=short

      - name: Type check
        run: mypy chika/ api/ config.py --ignore-missing-imports

      - name: Coverage
        env:
          CHIKA_PROVIDER: anthropic
          ANTHROPIC_API_KEY: test-key
        run: pytest tests/ --cov=chika --cov=api --cov-report=term-missing --cov-fail-under=60

      - name: Security scan
        run: |
          pip install bandit
          bandit -r chika/ api/ -ll -x tests/

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (skip WebSocket)
        env:
          CHIKA_PROVIDER: anthropic
          ANTHROPIC_API_KEY: test-key
        run: pytest tests/ -v --tb=short -k "not test_websocket"
