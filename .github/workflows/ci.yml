name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy chika/ api/ config.py --ignore-missing-imports

      - name: Security scan
        run: bandit -r chika/ api/ -ll -x tests/

      - name: Test + coverage
        env:
          CHIKA_PROVIDER: anthropic
          ANTHROPIC_API_KEY: test-key
        # The conftest auto-skips @pytest.mark.live_llm by default. CI never
        # calls a real LLM — see the live-llm workflow for the manual job.
        run: |
          pytest tests/ -v --tb=short \
            --cov=chika --cov=api \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=75

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (skip WebSocket)
        env:
          CHIKA_PROVIDER: anthropic
          ANTHROPIC_API_KEY: test-key
        # Starlette's TestClient WebSocket support requires threading primitives
        # that behave differently on Windows — skip those tests in the Windows job.
        run: pytest tests/ -v --tb=short -k "not test_websocket"

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Vitest unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Run Playwright e2e
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docs-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install docs deps
        working-directory: docs
        run: npm install

      - name: Install Playwright browsers
        # docs/playwright.config.js emulates iPhone / iPad / Pixel devices.
        # iPhone + iPad use webkit under the hood; Pixel uses chromium.
        # Both engines are required, otherwise the iphone/ipad projects
        # fail with "browserType.launch: Executable doesn't exist."
        working-directory: docs
        run: npx playwright install --with-deps chromium webkit

      - name: Run docs Playwright e2e
        working-directory: docs
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-playwright-report
          path: docs/playwright-report
          retention-days: 7

  extension-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install extension deps
        working-directory: extension
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: extension
        run: npx playwright install --with-deps chromium

      # MV3 extensions need a real display: headless Chromium doesn't
      # register the service worker, which makes the popupURL fixture
      # (waitForEvent('serviceworker')) time out for every test. xvfb
      # provides a virtual X server so Chrome runs headed.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run extension Playwright e2e (under xvfb)
        working-directory: extension
        run: xvfb-run -a npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-playwright-report
          path: extension/playwright-report
          retention-days: 7
