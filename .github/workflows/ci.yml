name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy chika/ api/ config.py --ignore-missing-imports

      - name: Security scan
        run: bandit -r chika/ api/ -ll -x tests/

      - name: Test + coverage
        env:
          CHIKA_PROVIDER: anthropic
          ANTHROPIC_API_KEY: test-key
        run: |
          pytest tests/ -v --tb=short \
            --cov=chika --cov=api \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests (skip WebSocket)
        env:
          CHIKA_PROVIDER: anthropic
          ANTHROPIC_API_KEY: test-key
        # Starlette's TestClient WebSocket support requires threading primitives
        # that behave differently on Windows — skip those tests in the Windows job.
        run: pytest tests/ -v --tb=short -k "not test_websocket"
