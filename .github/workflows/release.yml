name: Release

# Tag-driven release pipeline. Push a tag like ``v2.0.5`` and this
# workflow:
#
#   1. Builds a Python wheel.
#   2. Builds installers on every supported runner:
#        - Windows .exe via Inno Setup
#        - macOS .pkg via pkgbuild + productbuild
#        - Linux .deb via dpkg-deb
#   3. Creates a GitHub Release with the wheel + all three installers
#      attached as assets.
#
# The naming scheme each installer build produces:
#
#   chika-{version}-py3-none-any.whl
#   chika-setup-{version}.exe
#   Chika-{version}.pkg
#   chika_{version}_all.deb
#
# Keep these in sync with the ``_expected_asset_name`` map in
# chika/_cli/update.py — that's how ``chika update`` finds the right
# asset on releases/latest for each install kind.
#
# Tag format: ``vX.Y.Z`` (with leading v). The pipeline strips the v
# before passing to each builder so the artefacts report a clean
# version.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v)'
        required: true
        default: '2.0.0'

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist

      - name: Verify wheel name matches version
        run: |
          ls dist/chika-${{ steps.version.outputs.version }}-*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 7

  build-windows-installer:
    needs: build-wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - name: Verify Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found at $iscc — runner image may have changed"
          }

      - name: Build installer
        shell: pwsh
        run: |
          .\installers\windows\build_installer.ps1 `
            -Version "${{ needs.build-wheel.outputs.version }}" `
            -SkipWheel

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installers/dist/chika-setup-*.exe
          retention-days: 30

  build-macos-installer:
    needs: build-wheel
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - name: Build .pkg
        run: |
          chmod +x installers/macos/build_pkg.sh
          chmod +x installers/macos/scripts/preinstall installers/macos/scripts/postinstall
          chmod +x installers/macos/chika installers/macos/uninstall.sh
          ./installers/macos/build_pkg.sh \
            --version "${{ needs.build-wheel.outputs.version }}" \
            --skip-wheel

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: installers/dist/Chika-*.pkg
          retention-days: 30

  build-linux-deb:
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Build .deb
        run: |
          chmod +x installers/linux/build_deb.sh
          chmod +x installers/linux/debian/postinst installers/linux/debian/prerm
          chmod +x installers/linux/chika installers/linux/install.sh
          ./installers/linux/build_deb.sh \
            --version "${{ needs.build-wheel.outputs.version }}" \
            --skip-wheel

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: installers/dist/chika_*.deb
          retention-days: 30

  publish-release:
    needs: [build-wheel, build-windows-installer, build-macos-installer, build-linux-deb]
    runs-on: ubuntu-latest
    # Run for both tag pushes (the canonical trigger) AND manual
    # workflow_dispatch — the manual path lets you ship a release
    # without pushing a tag locally first. ``gh release create``
    # below creates the tag at the current commit when one doesn't
    # already exist, so both code paths land at the same end state.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: linux-deb
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.build-wheel.outputs.version }}"
          gh release create "v$VERSION" \
            --title "Chika v$VERSION" \
            --generate-notes \
            dist/chika-${VERSION}-*.whl \
            dist/chika-setup-${VERSION}.exe \
            dist/Chika-${VERSION}.pkg \
            dist/chika_${VERSION}_all.deb
