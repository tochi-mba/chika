<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header/Navbar -->
    <header class="navbar">
        <div class="navbar-container">
            <div class="logo">NETFLIX</div>
            <input type="text" id="searchInput" class="search-bar" placeholder="Search movies...">
            <div class="nav-links">
                <a href="#">Home</a>
                <a href="#">TV Shows</a>
                <a href="#">Movies</a>
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="hero" id="hero">
        <div class="hero-content">
            <h1 id="heroTitle">Featured Movie</h1>
            <p id="heroDesc">Watch amazing content exclusively on our platform</p>
            <button class="btn-play">▶ Play Now</button>
        </div>
    </section>

    <!-- Movie Categories -->
    <main class="container">
        <section class="category" id="trendingSection">
            <h2>Trending Now</h2>
            <div class="movie-grid" id="trendingGrid"></div>
        </section>

        <section class="category" id="popularSection">
            <h2>Popular</h2>
            <div class="movie-grid" id="popularGrid"></div>
        </section>

        <section class="category" id="topRatedSection">
            <h2>Top Rated</h2>
            <div class="movie-grid" id="topRatedGrid"></div>
        </section>

        <section class="category" id="actionSection">
            <h2>Action & Adventure</h2>
            <div class="movie-grid" id="actionGrid"></div>
        </section>
    </main>

    <!-- Modal -->
    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <img id="modalImage" src="" alt="Movie">
            <div class="modal-info">
                <h2 id="modalTitle"></h2>
                <p class="modal-year" id="modalYear"></p>
                <p class="modal-rating" id="modalRating"></p>
                <p class="modal-description" id="modalDesc"></p>
                <button class="btn-play">▶ Play</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
